kind = "web"
previewPath = "/"
title = "TaskSaver AI"
version = "1.0.0"
id = "artifacts/tasksaver-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26191

[services.development]
run = "pnpm --filter @workspace/tasksaver-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tasksaver-ai", "run", "build" ]
publicDir = "artifacts/tasksaver-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26191"
BASE_PATH = "/"
